
name: Auto Generate Sitemap

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - '**/*.html'
      - 'sitemap.xml'
      - '.github/workflows/sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate sitemap
        run: |
          python3 <<'PY'
          from pathlib import Path
          from datetime import date
          from xml.sax.saxutils import escape

          base_url = (
              "https://michaelryan.michaelryan03.workers.dev"
          )

          excluded = {
              "404.html",
          }

          urls = []

          for path in sorted(Path(".").rglob("*.html")):
              if ".git" in path.parts:
                  continue

              if any(part.startswith(".") for part in path.parts):
                  continue

              if path.name in excluded:
                  continue

              if path.as_posix() == "index.html":
                  url = base_url + "/"
              elif path.name == "index.html":
                  url = base_url + "/" + str(path.parent).replace("\\", "/") + "/"
              else:
                  url = base_url + "/" + path.as_posix()

              urls.append(url)

          today = date.today().isoformat()

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]

          for url in urls:
              lines.extend([
                  "  <url>",
                  f"    <loc>{escape(url)}</loc>",
                  f"    <lastmod>{today}</lastmod>",
                  "  </url>"
              ])

          lines.append("</urlset>")

          Path("sitemap.xml").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print(f"Generated sitemap with {len(urls)} URLs")
          PY

      - name: Commit sitemap changes
        run: |
          git add sitemap.xml

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto update sitemap"
            git push
          fi
